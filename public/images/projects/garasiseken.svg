  <text x="330" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="2" fill="#F2F0EA">GS</text>

  <!-- wordmark -->
  <text x="330" y="482" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="10" fill="#F2F0EA">GARASISEKEN</text>
  <text x="330" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="5" fill="#8A8780">AUTOMOTIVE WORKSHOP</text>
  <path d="M200 534H460" stroke="#C69345" stroke-width="1"/>

  <!-- sticker -->
  <circle cx="700" cy="308" r="80" fill="#C69345"/>
  <circle cx="700" cy="308" r="68" fill="none" stroke="#1B1B19" stroke-width="1" stroke-opacity="0.25"/>
  <text x="700" y="324" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#1B1B19">GS</text>

  <!-- light card -->

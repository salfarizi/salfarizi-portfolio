  <ellipse cx="930" cy="382" rx="34" ry="15" fill="#D18A67"/>
  <text x="813" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#171717">Dry-aged ribeye</text>
  <text x="813" y="462" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#77746B">Prime Cuts · 1.8 km</text>
  <text x="1047" y="446" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7C8B6A">OPEN</text>

  <!-- supplier card 2 -->
  <rect x="805" y="508" width="250" height="164" fill="#FFFFFF" stroke="#E3DDCF"/>
  <rect x="813" y="516" width="234" height="88" fill="#8A9A72"/>
  <ellipse cx="930" cy="560" rx="58" ry="28" fill="#75855E"/>
  <ellipse cx="930" cy="560" rx="30" ry="13" fill="#A3B08B"/>
  <text x="813" y="624" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#171717">Farm chicken</text>
  <text x="813" y="640" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#77746B">Seken Farm · 2.4 km</text>
  <text x="1047" y="624" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7C8B6A">OPEN</text>


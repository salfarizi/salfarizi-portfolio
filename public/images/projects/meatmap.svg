  <rect x="765" y="140" width="330" height="685" rx="42" fill="#171717"/>
  <rect x="783" y="158" width="294" height="649" rx="28" fill="#F8F5EC"/>
  <rect x="884" y="170" width="92" height="7" rx="3.5" fill="#171717"/>


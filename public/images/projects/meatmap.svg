  <text x="1057" y="218" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="1.5" fill="#8A8578">12 SHOPS</text>

  <rect x="805" y="238" width="250" height="40" rx="20" fill="#EAE5D9"/>
  <circle cx="824" cy="258" r="6" stroke="#8A8578" stroke-width="1.6"/>

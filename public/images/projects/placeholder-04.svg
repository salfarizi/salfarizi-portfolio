<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#efeeea"/>

  <!-- frame -->
  <rect x="40" y="40" width="1120" height="820" stroke="#e2e1dc" stroke-width="1"/>

  <!-- corner ticks -->
  <g stroke="#d7d6d0" stroke-width="1">
    <path d="M40 96V40h56"/>
    <path d="M1104 40h56v56"/>
    <path d="M1160 804v56h-56"/>
    <path d="M96 860H40v-56"/>
  </g>

  <!-- labels -->
  <text x="76" y="86" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#171717">IMAGE PLACEHOLDER</text>
  <text x="1124" y="86" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#8a8a86">PROJECT ARTWORK — 4:3</text>

  <!-- hatch panel -->
  <defs>
    <pattern id="p4hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(34)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#d7d6d0" stroke-width="1"/>
    </pattern>
    <linearGradient id="p4fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efeeea" stop-opacity="0"/>
      <stop offset="1" stop-color="#efeeea" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="150" y="180" width="900" height="480" fill="url(#p4hatch)"/>
  <rect x="150" y="180" width="900" height="480" fill="url(#p4fade)"/>
  <rect x="150" y="180" width="900" height="480" stroke="#e2e1dc" stroke-width="1"/>
  <rect x="150" y="660" width="360" height="1" fill="#171717" opacity="0.4"/>
  <text x="150" y="700" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#8a8a86">04 — TEXTURE / COMING SOON</text>

  <!-- footer -->
  <line x1="76" y1="792" x2="1124" y2="792" stroke="#e2e1dc" stroke-width="1"/>
  <text x="76" y="824" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#8a8a86">ARTWORK PENDING</text>
  <text x="1124" y="824" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#8a8a86">04 / 04</text>
</svg>

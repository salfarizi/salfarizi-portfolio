<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <rect width="1200" height="900" fill="#E8E2D7"/>

  <text x="70" y="72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#1C1A17">NOVELYA</text>
  <text x="1130" y="72" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#77716A">GRAPHIC DESIGN — 2024</text>

  <!-- poster -->
  <rect x="90" y="115" width="460" height="685" fill="#1C1A17"/>
  <text x="120" y="158" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#F4EFE6" opacity="0.65">INDEPENDENT FICTION</text>
  <text x="120" y="765" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#F4EFE6" opacity="0.65">ISSUE 01 / 2024</text>

  <text transform="translate(355 470) rotate(-90)" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="6" fill="#F4EFE6">NOVELYA</text>

  <!-- vermilion form -->
  <circle cx="548" cy="320" r="136" fill="#B84A2F"/>
  <circle cx="548" cy="320" r="96" stroke="#F4EFE6" stroke-opacity="0.35"/>

  <!-- right editorial column -->
  <text x="700" y="150" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#77716A">NEW VOICES IN FICTION</text>
  <text x="700" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#1C1A17">Issue 01</text>
  <path d="M700 240H1100" stroke="#C9C0B3"/>
  <text x="700" y="278" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6F6A61">A quarterly collection of short fiction,</text>
  <text x="700" y="297" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6F6A61">essays, and visual notes from writers</text>
  <text x="700" y="316" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6F6A61">finding new ways to tell a story.</text>

  <!-- cover study panel -->
  <rect x="700" y="365" width="400" height="320" fill="#F4EFE6" stroke="#1C1A17"/>
  <rect x="720" y="385" width="150" height="280" fill="#7C8B6F"/>
  <text x="795" y="570" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#F4EFE6">N</text>

  <text x="898" y="425" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.5" fill="#77716A">COVER STUDY</text>
  <text x="898" y="462" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#1C1A17">A NEW</text>
  <text x="898" y="487" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#1C1A17">LITERARY</text>
  <text x="898" y="512" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="0.5" fill="#1C1A17">VOICE</text>

  <path d="M898 540H1078" stroke="#D5CCBE"/>
  <text x="898" y="566" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6F6A61">Typography, form, and a single</text>
  <text x="898" y="583" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#6F6A61">recurring geometric gesture.</text>
  <text x="898" y="635" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2" fill="#1C1A17">NOVELYA PRESS</text>

  <path d="M700 728H1100" stroke="#C9C0B3"/>
  <text x="700" y="765" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77716A">POSTER SERIES / IDENTITY</text>
  <text x="1100" y="765" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77716A">01 — 03</text>

  <text x="70" y="870" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77716A">BRAND IDENTITY — EDITORIAL, TYPOGRAPHY</text>
  <text x="1130" y="870" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77716A">SELECTED / 03</text>
</svg>

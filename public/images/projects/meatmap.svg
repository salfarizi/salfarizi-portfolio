  <text x="120" y="203" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#77746B">Local suppliers, nearby</text>

  <!-- legend -->
  <rect x="100" y="730" width="260" height="70" fill="#F8F5EC" stroke="#22271F"/>
  <text x="120" y="757" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77746B">NEARBY SUPPLIERS</text>

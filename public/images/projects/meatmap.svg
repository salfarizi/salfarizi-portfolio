  <path d="M805 730H1055" stroke="#E3DDCF"/>
  <g fill="#171717">
    <circle cx="842" cy="760" r="4"/>
    <circle cx="913" cy="760" r="4" fill="#C9C3B6"/>
    <circle cx="984" cy="760" r="4" fill="#C9C3B6"/>
    <circle cx="1055" cy="760" r="4" fill="#C9C3B6"/>
  </g>
  <rect x="897" y="787" width="66" height="4" rx="2" fill="#171717" opacity="0.25"/>

  <text x="70" y="870" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77746B">MOBILE APP — RESEARCH, UI DESIGN, PROTOTYPE</text>
  <text x="1130" y="870" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#77746B">CONCEPT / 01</text>

    <rect x="865" y="292" width="58" height="24" rx="12" fill="#EAE5D9"/>
    <text x="894" y="308" text-anchor="middle" fill="#6B675D">Beef</text>
    <rect x="931" y="292" width="70" height="24" rx="12" fill="#EAE5D9"/>
    <text x="966" y="308" text-anchor="middle" fill="#6B675D">Poultry</text>
    <rect x="1009" y="292" width="46" height="24" rx="12" fill="#EAE5D9"/>
    <text x="1032" y="308" text-anchor="middle" fill="#6B675D">More</text>

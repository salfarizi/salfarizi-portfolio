  <text x="892" y="432" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#F2F0EA">GARASISEKEN</text>
  <text x="892" y="452" font-family="Arial, Helvetica, sans-serif" font-size="7" letter-spacing="3" fill="#8A8780">AUTOMOTIVE WORKSHOP</text>

  <text x="896" y="272" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="4" fill="#1B1B19">GARASISEKEN</text>
  <text x="896" y="292" font-family="Arial, Helvetica, sans-serif" font-size="7" letter-spacing="3" fill="#8A8780">AUTOMOTIVE WORKSHOP</text>
  <path d="M838 316H1108" stroke="#DCD8CE"/>
  <text x="838" y="338" font-family="Arial, Helvetica, sans-serif" font-size="7" letter-spacing="2" fill="#8A8780">SERVICE — REPAIR — RESTORATION</text>

  <!-- reversed card -->
  <rect x="810" y="388" width="326" height="150" fill="#262623" stroke="#3B3A35"/>
  <circle cx="852" cy="436" r="22" stroke="#C69345" stroke-width="2"/>

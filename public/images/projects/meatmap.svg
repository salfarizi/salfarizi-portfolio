    <path d="M70 420H700"/>
    <path d="M70 610H700"/>
    <path d="M205 115V825"/>
    <path d="M425 115V825"/>
    <path d="M570 115V825"/>
  </g>
  <g stroke="#C9CEBC" stroke-width="1">
    <path d="M70 330H700"/>
    <path d="M70 520H700"/>
    <path d="M310 115V825"/>
    <path d="M500 115V825"/>
  </g>

  <!-- highlighted zone -->
  <circle cx="340" cy="470" r="86" fill="#C06B4A" opacity="0.1"/>
  <circle cx="340" cy="470" r="86" stroke="#C06B4A" stroke-opacity="0.35" stroke-dasharray="4 6"/>

  <!-- route -->
  <path d="M150 720C250 650 230 520 340 470C450 420 520 390 600 300" stroke="#7C8B6A" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>

  <!-- pins -->
  <circle cx="600" cy="300" r="12" fill="#22271F"/>
  <circle cx="600" cy="300" r="4" fill="#F8F5EC"/>
  <circle cx="150" cy="720" r="12" fill="#22271F"/>
  <circle cx="150" cy="720" r="4" fill="#F8F5EC"/>
  <circle cx="340" cy="470" r="19" fill="#C06B4A"/>
  <circle cx="340" cy="470" r="7" fill="#F8F5EC"/>

